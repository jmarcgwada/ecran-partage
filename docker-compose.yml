# ============================================================================
# ECRAN PARTAGE
#
#   http://<nas>:8802/scene         a ouvrir en plein ecran dans la salle
#   http://<nas>:8802/salle/<code>  ou menent les QR codes
#
# Le cahier voulait ce service hors d'Internet (§9.3). Il y est desormais, par
# choix : les telephones en 4G doivent pouvoir rejoindre la reunion. Ce qui le
# rend possible, c'est la PORTE PUBLIQUE (src/acces.js) — depuis Internet rien
# ne se lit sans le code de salle, et les codes faux sont limites. Voir le README.
#
# L'ecran de la salle n'a pas de code a presenter. Sur le reseau local il
# s'ouvre tel quel ; par l'adresse publique il presente un JETON — voir le
# README. Sans jeton, /scene explique ce qui manque et n'ouvre rien.
# ============================================================================

services:
  ecran-partage:
    build: .
    image: ecran-partage:0.1.0
    container_name: ecran-partage
    restart: unless-stopped

    # Le pont PAR DEFAUT de Docker, et non un reseau a nous : sur ce NAS, la
    # reserve d'adresses privees de Docker est epuisee par les projets deja en
    # place, et la creation d'un reseau supplementaire echoue avec
    # « could not find an available, non-overlapping IPv4 address pool » — un
    # message qui ne parle pas de saturation.
    network_mode: bridge

    ports:
      - "8802:8802"

    volumes:
      # Les reglages, et les documents de la reunion EN COURS. Ce dossier est
      # vide a chaque demarrage : il n'a rien a faire dans une sauvegarde.
      - ./data:/data

    environment:
      ECR_HTTP_PORT: "8802"
      ECR_DATA_DIR: /data
      TZ: Europe/Paris

      ECR_NOM_SALLE: "Salle de réunion"

      # L'adresse par laquelle un TELEPHONE joint le service — c'est elle qu'on
      # encode dans le QR code. Laissee vide, on encode l'adresse par laquelle
      # l'ecran de la salle a ouvert la page.
      #
      # Pour une exposition sur Internet, c'est l'adresse PUBLIQUE, et elle sert
      # AUSSI a reconnaitre la porte publique : une requete qui demande ce nom
      # d'hote vient d'Internet.
      #   exemple : https://ecran.exemple.fr
      #
      # ATTENTION : ce reglage n'agit qu'au TOUT PREMIER demarrage. Ensuite
      # c'est data/reglages.json qui commande, et cette ligne est ignoree.
      ECR_ADRESSE_PUBLIQUE: ""

      # 50 Mo par fichier : de quoi laisser passer un .pptx bourre d'images.
      ECR_TAILLE_MAX_MO: "50"
      ECR_FICHIERS_MAX: "10"

      # Le filet du §9.2 : une reunion que personne n'a terminee s'efface
      # d'elle-meme apres ce nombre d'heures SANS ACTIVITE.
      ECR_EFFACEMENT_HEURES: "4"

      # Depuis Internet : codes de salle faux permis par adresse en dix minutes,
      # avant mise en attente.
      ECR_CODES_FAUX_MAX: "10"

      # Le secours du role d'animateur : sans signe de vie de son telephone
      # pendant ce delai, le role redevient revendicable.
      ECR_ANIMATEUR_ABSENT_MINUTES: "10"
